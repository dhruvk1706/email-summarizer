name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # summarizer.py builds the Vertex client at import; a project skips the credential lookup.
      - env:
          GOOGLE_CLOUD_PROJECT: ci
          GOOGLE_CLOUD_LOCATION: us-central1
        run: |
          python test_agent.py
          python test_webhook.py
          python test_extract_body.py
          python test_drafting.py
          python state.py
          python test_rag.py
